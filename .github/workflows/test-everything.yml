name: Build and Test Everything (All OS/Arch)

on:
  #For caching
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      kotlin-version:
        description: "Override Kotlin version?"
        required: false
        default: ""
        type: string
      testballoon-version:
        description: "Override TestBalloon version (full version string)?"
        required: false
        default: ""
        type: string

jobs:
  build-and-test-android:
    uses: ./.github/workflows/test-android.yml
    with:
      override-cache: ${{ github.ref_name == 'development' || github.ref_name == 'main' }}
      kotlin-version: ${{ inputs.kotlin-version }}
      testballoon-version: ${{ inputs.testballoon-version }}
    secrets: inherit

  build-and-test-ios:
    uses: ./.github/workflows/test-ios.yml
    with:
      override-cache: ${{ github.ref_name == 'development' || github.ref_name == 'main' }}
      kotlin-version: ${{ inputs.kotlin-version }}
      testballoon-version: ${{ inputs.testballoon-version }}
    secrets: inherit

  publish-public:
    needs: [build-and-test-android, build-and-test-ios]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'a-sit-plus/private-valera' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/development' &&
      github.event.deleted != true
    permissions:
      contents: read
    uses: a-sit-plus/internal-workflows/.github/workflows/publish-public.yml@main
    with:
      source-repository: a-sit-plus/private-valera
      source-branch: development
      destination-repository: a-sit-plus/valera
      destination-branch: development
      app-client-id: ${{ vars.PUBLIC_SYNC_APP_CLIENT_ID }}
      runner-labels: '["self-hosted", "Linux"]'
    secrets:
      app-private-key: ${{ secrets.PUBLIC_SYNC_APP_PRIVATE_KEY }}
