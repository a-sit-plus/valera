name: Build and Test Android

on:
  workflow_call:
    inputs:
      override-cache:
        description: "Override Cache?"
        required: false
        default: false
        type: boolean
      kotlin-version:
        description: "Override Kotlin version?"
        required: false
        default: ""
        type: string
      testballoon-version:
        description: "Override TestBalloon version (full version string)?"
        required: false
        default: ""
        type: string

jobs:
  build-and-test-android:
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted", "Linux"]' || '["ubuntu-latest"]') }}
    env:
      KOTLIN_VERSION_ENV: ${{ inputs.kotlin-version }}
      TESTBALLOON_VERSION_OVERRIDE: ${{ inputs.testballoon-version }}
    steps:
      - name: Common setup
        uses: a-sit-plus/internal-workflows/.github/actions/common-setup@main
        with:
          override-cache: ${{ inputs.override-cache }}
          enable-kvm: ${{ !github.event.repository.private }}

      - name: Check preconfigured KVM access on private runner
        if: ${{ github.event.repository.private }}
        shell: bash
        run: |
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::Android emulator tests require read/write access to /dev/kvm. Configure KVM access for the runner account on the host; for container runners, also pass /dev/kvm into the container with the appropriate group access. This workflow does not use sudo on private runners."
            exit 1
          fi

      - name: Build apk
        run: ./gradlew -U :androidApp:compileDebugSources
        env:
          CI: true

      - name: Run Android tests
        run: ./gradlew -Dkotlin.build.report.json.directory="$PWD/metrics" pixel2api35AndroidDeviceTest
        env:
          CI: true

      - name: Reporting
        uses: a-sit-plus/internal-workflows/.github/actions/common-reporting@v2
        if: success() || failure()
        with:
          report-name: ${{ github.workflow }}
          matrix-identifier: ${{ runner.os }}-androidRunner-${{ runner.arch }}
