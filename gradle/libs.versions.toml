[versions]
vck="7.0.0-SNAPSHOT"

agp = "8.12.3"
kotlin = "2.3.0"
compose-plugin = "1.10.3"
compose-material-icons-core = "1.7.3"
compose-material3 = "1.10.0-alpha05"
koin = "4.2.2"
# TestBallon has to be the same version as in vck, otherwise tests in composite builds may fail
testballoon = "1.0.0-K2.3.0"

accompanist-permissions = "0.37.3"
activity-compose = "1.13.0"
appcompat = "1.7.1"
barcode-scanning = "17.3.0"
biometric = "1.2.0-alpha05"
core-ktx = "1.18.0"

camera-camera2 = "1.6.1"
datastore-preferences-core = "1.2.1"
multipaz = "0.99.0"
navigation-compose = "2.9.2"
navigationevent-compose = "1.0.1" # Check if issuing a credential works on iOS after upgrading this. 1.1.0 has an issue, possibly just requires a compose update
semver = "2.1.0"

atomicfu = "0.32.1"
qrose = "1.1.2"
core-splashscreen = "1.2.0"
androidx-browser = "1.10.0"

authcheckkit = "1.0.0-alpha01"
warden-supreme = "1.0.0-RC11"


# Test if DC API verification and issuing are still working after upgrading the following libraries:
androidx-credentials = "1.7.0-alpha02"
androidx-credentials-registry-provider = "1.0.0-alpha04"


[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera-camera2" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camera-camera2" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera-camera2" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref="androidx-credentials" }
androidx-credentials-registry-provider = { module = "androidx.credentials.registry:registry-provider", version.ref = "androidx-credentials-registry-provider" }
androidx-registry-provider-play-services = { module = "androidx.credentials.registry:registry-provider-play-services", version.ref = "androidx-credentials-registry-provider" }
atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "atomicfu" }
barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "barcode-scanning" }
datastore-core-okio = { module = "androidx.datastore:datastore-core-okio", version.ref = "datastore-preferences-core" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore-preferences-core" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }
testballoon = { module = "de.infix.testBalloon:testBalloon-framework-shared", version.ref = "testballoon" }
testballoon-framework-core = { module = "de.infix.testBalloon:testBalloon-framework-core", version.ref = "testballoon" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
qrose = { group = "io.github.alexzhirkevich", name = "qrose", version.ref="qrose"}
multipaz = { module = "org.multipaz:multipaz", version.ref = "multipaz" }
multipaz-compose = { module = "org.multipaz:multipaz-compose", version.ref = "multipaz" }
multipaz-doctypes = { module = "org.multipaz:multipaz-doctypes", version.ref = "multipaz" }
semver = { module = "net.swiftzer.semver:semver", version.ref = "semver" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
back-handler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-plugin" }
navigation-event-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent-compose" }
authcheckkit = { module = "at.asitplus.authcheckkit:core", version.ref = "authcheckkit"}

compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-plugin" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-plugin" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons-core" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-plugin" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-plugin" }

vck = {group= "at.asitplus.wallet", name="vck", version.ref = "vck"}
vck-openid = {group= "at.asitplus.wallet", name="vck-openid", version.ref = "vck"}
vck-openid-ktor = {group= "at.asitplus.wallet", name="vck-openid-ktor", version.ref = "vck"}
warden-supreme = { module = "at.asitplus.warden:supreme-client", version.ref = "warden-supreme" }

#multipazz workaround
datetime-compat = {module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.7.1-0.6.x-compat"}

[plugins]
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose" }
